<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinsei City · Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #06070a;
    --bg-app: #0a0b10;
    --bg-surface: #14161c;
    --bg-input: #191b22;
    --border: #23262f;
    --border-soft: #1a1c24;
    --text-primary: #e9e7df;
    --text-secondary: #8d8f9a;
    --text-muted: #55575f;
    --accent: #5DCAA5;
    --accent-ink: #04342C;
    --font-display: 'Rajdhani', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-body: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg-page);
    background-image:
      repeating-linear-gradient(0deg, rgba(93,202,165,0.025) 0px, rgba(93,202,165,0.025) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, rgba(93,202,165,0.025) 0px, rgba(93,202,165,0.025) 1px, transparent 1px, transparent 34px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 16px;
  }

  #frame {
    position: relative;
    max-width: 390px;
    width: 100%;
    height: 100%;
    padding: 10px;
  }
  #frame::before, #frame::after,
  #frame .br-tl, #frame .br-br {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: var(--accent);
    opacity: 0.85;
  }
  #frame::before { top: 0; left: 0; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  #frame::after { bottom: 0; right: 0; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  #frame .br-tl { top: 0; right: 0; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  #frame .br-br { bottom: 0; left: 0; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }

  #app {
    background: var(--bg-app);
    border: 0.5px solid var(--border);
    overflow: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .screen.active { display: flex; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  input, select {
    width: 100%;
    background: var(--bg-input);
    border: 0.5px solid var(--border);
    color: var(--text-primary);
    font-size: 14px;
    font-family: var(--font-body);
    padding: 11px 14px;
    border-radius: 6px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button { font-family: var(--font-body); cursor: pointer; }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-primary);
    border: 0.5px solid var(--border);
    padding: 12px;
    border-radius: 6px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .error-text { font-size: 12px; color: #E8807F; padding: 4px 2px; font-family: var(--font-mono); }

  .avatar {
    position: relative;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    flex-shrink: 0;
  }
  .avatar::before, .avatar::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
  }
  .avatar::before { top: -2px; left: -2px; border-top: 1.5px solid var(--accent); border-left: 1.5px solid var(--accent); }
  .avatar::after { bottom: -2px; right: -2px; border-bottom: 1.5px solid var(--accent); border-right: 1.5px solid var(--accent); }

  /* Login screen */
  #login-header { padding: 36px 26px 22px; text-align: center; border-bottom: 0.5px solid var(--border-soft); margin-bottom: 22px; }
  #login-header .title { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--text-primary); letter-spacing: 1px; text-transform: uppercase; }
  #login-header .subtitle { font-family: var(--font-mono); font-size: 11px; color: var(--accent); margin-top: 6px; }
  .mode-toggle { display: flex; margin: 0 26px 20px; background: var(--bg-input); border-radius: 6px; padding: 3px; }
  .mode-toggle button {
    flex: 1; padding: 9px; border: none; border-radius: 4px; font-family: var(--font-display);
    font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase;
    background: transparent; color: var(--text-secondary);
  }
  .mode-toggle button.active { background: var(--bg-surface); color: var(--text-primary); }
  #login-form { padding: 0 26px; display: flex; flex-direction: column; gap: 14px; }
  #login-form label.eyebrow { display: block; margin-bottom: 7px; }
  #login-footer { padding: 20px 26px; margin-top: auto; font-size: 11px; color: var(--text-muted); line-height: 1.6; text-align: center; border-top: 0.5px solid var(--border-soft); }

  /* Hub screen */
  #hub-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 0.5px solid var(--border); }
  #hub-top .who { display: flex; align-items: center; gap: 11px; }
  #hub-top .avatar { width: 34px; height: 34px; font-size: 13px; background: var(--bg-surface); color: var(--accent); }
  #hub-top .username { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.3px; }
  #logout-btn { background: transparent; border: none; color: var(--text-muted); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; }
  #new-conv-zone { padding: 14px 18px; border-bottom: 0.5px solid var(--border); }
  #new-conv-form { display: none; flex-direction: column; gap: 8px; }
  #new-conv-form.active { display: flex; }
  #new-conv-form .row { display: flex; gap: 8px; }
  #new-conv-form .row button { flex: 1; }
  #conv-list { flex: 1; min-height: 0; overflow-y: auto; }
  .conv-item { display: flex; align-items: center; gap: 13px; padding: 13px 18px; cursor: pointer; border-bottom: 0.5px solid var(--border-soft); transition: background 0.15s; }
  .conv-item:hover { background: var(--bg-surface); }
  .conv-item .avatar { width: 44px; height: 44px; font-size: 16px; }
  .conv-item .info { flex: 1; min-width: 0; }
  .conv-item .top-line { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .conv-item .top-line span:first-child { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.2px; }
  .conv-item .preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty-state { padding: 44px 22px; text-align: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.3px; }

  /* Chat screen */
  #chat-top { display: flex; align-items: center; gap: 11px; padding: 14px 18px; border-bottom: 0.5px solid var(--border); background: var(--bg-surface); }
  #chat-back { color: var(--text-primary); cursor: pointer; display: flex; align-items: center; }
  #chat-top .avatar { width: 32px; height: 32px; font-size: 12px; }
  #chat-top .top-line { display: flex; align-items: center; gap: 8px; }
  #chat-top .top-line span:first-child { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.2px; }
  #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg-row { max-width: 75%; }
  .msg-row.mine { align-self: flex-end; }
  .msg-row.theirs { align-self: flex-start; }
  .bubble { font-size: 13.5px; padding: 9px 13px; line-height: 1.45; word-break: break-word; font-family: var(--font-body); }
  .msg-row.mine .bubble { background: var(--accent); color: var(--accent-ink); border-radius: 14px 14px 3px 14px; }
  .msg-row.theirs .bubble { background: var(--bg-surface); color: var(--text-primary); border-radius: 14px 14px 14px 3px; border: 0.5px solid var(--border); }
  .msg-time { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-muted); display: block; margin-top: 3px; }
  .msg-row.mine .msg-time { text-align: right; margin-right: 4px; }
  .msg-row.theirs .msg-time { margin-left: 4px; }
  #chat-form { display: flex; align-items: center; gap: 9px; padding: 13px 16px; border-top: 0.5px solid var(--border); background: var(--bg-surface); }
  #chat-form input { flex: 1; border-radius: 20px; background: var(--bg-app); }
  #chat-form button {
    background: var(--accent); border: none; width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent-ink);
  }
  #send-image-btn { background: var(--bg-app); border: 0.5px solid var(--border); color: var(--text-secondary); }
  .bubble-image { padding: 0 !important; overflow: hidden; }
  .bubble-image img { display: block; max-width: 220px; width: 100%; }

  .conv-item { position: relative; }
  .conv-item.unread .top-line span:first-child { color: var(--text-primary); }
  .conv-item.unread .preview { color: var(--text-primary); font-weight: 500; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .conv-delete {
    background: transparent; border: none; color: var(--text-muted); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 6px; opacity: 0.5;
  }
  .conv-delete:hover { opacity: 1; color: #E8807F; }

  #boot-error { padding: 30px 26px; color: #E8807F; font-family: var(--font-mono); font-size: 12px; text-align: center; line-height: 1.7; }

  .icon-edit {
    background: transparent; border: none; color: var(--text-muted); padding: 3px;
    display: flex; align-items: center; justify-content: center; opacity: 0.6; flex-shrink: 0;
  }
  .icon-edit:hover { opacity: 1; color: var(--accent); }

  .msg-row { position: relative; }
  .msg-wrap { display: flex; align-items: flex-end; gap: 5px; }
  .msg-row.mine .msg-wrap { flex-direction: row-reverse; }
  .react-trigger {
    background: transparent; border: none; color: var(--text-muted); opacity: 0;
    display: flex; align-items: center; justify-content: center; padding: 4px; flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .msg-row:hover .react-trigger { opacity: 0.6; }
  .react-trigger:hover { opacity: 1 !important; color: var(--accent); }
  .react-picker {
    display: none; gap: 4px; background: var(--bg-surface); border: 0.5px solid var(--border);
    border-radius: 20px; padding: 5px 7px; position: absolute; top: -34px; z-index: 5;
  }
  .msg-row.mine .react-picker { right: 0; }
  .msg-row.theirs .react-picker { left: 0; }
  .react-picker.open { display: flex; }
  .react-picker button { background: transparent; border: none; font-size: 15px; padding: 2px; line-height: 1; }
  .react-picker button:hover { transform: scale(1.2); }
  .reactions { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .msg-row.mine .reactions { justify-content: flex-end; }
  .reaction-chip {
    font-family: var(--font-mono); font-size: 11px; background: var(--bg-surface); border: 0.5px solid var(--border);
    border-radius: 10px; padding: 1px 7px; cursor: pointer; color: var(--text-secondary);
  }
  .reaction-chip.mine-reaction { border-color: var(--accent); color: var(--accent); }

  .quote-bar {
    display: none; align-items: center; gap: 8px; padding: 8px 16px; background: var(--bg-app);
    border-top: 0.5px solid var(--border); border-left: 2px solid var(--accent);
  }
  .quote-bar.open { display: flex; }
  .quote-bar .qb-text { flex: 1; min-width: 0; font-size: 12px; color: var(--text-secondary); }
  .quote-bar .qb-text b { color: var(--accent); font-family: var(--font-mono); font-weight: 500; }
  .quote-bar .qb-close { background: transparent; border: none; color: var(--text-muted); flex-shrink: 0; display: flex; }

  .quoted-block {
    font-size: 11.5px; padding: 5px 9px; border-radius: 8px; margin-bottom: 5px;
    background: rgba(0,0,0,0.15); border-left: 2px solid currentColor; opacity: 0.85;
  }
  .quoted-block b { font-family: var(--font-mono); font-weight: 500; }

  .date-sep { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .date-sep::before, .date-sep::after { content: ""; flex: 1; height: 0.5px; background: var(--border); }
  .date-sep span { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.5px; color: var(--text-muted); white-space: nowrap; }

  .presence-dot {
    position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg-app);
  }
  #chat-top .presence-dot { box-shadow: 0 0 0 2px var(--bg-surface); }

  .bubble.deleted { font-style: italic; color: var(--text-muted) !important; background: transparent !important; border: 0.5px dashed var(--border) !important; }
</style>
</head>
<body>

<div id="frame">
  <span class="br-tl"></span><span class="br-br"></span>
  <div id="app">
    <div id="boot-error" style="display:none;"></div>

    <div id="screen-login" class="screen active">
      <div id="login-header">
        <div class="title">Shinsei City</div>
        <div class="subtitle">// réseau citoyen — instagram</div>
      </div>
      <div class="mode-toggle">
        <button id="mode-login" class="active" type="button">Connexion</button>
        <button id="mode-create" type="button">Créer un compte</button>
      </div>
      <form id="login-form">
        <div>
          <label class="eyebrow">Identifiant citoyen</label>
          <input id="login-username" type="text" placeholder="pseudo_du_perso" autocomplete="off">
        </div>
        <div>
          <label class="eyebrow">Code d'accès</label>
          <input id="login-code" type="password" placeholder="code perso" autocomplete="off">
        </div>
        <div id="avatar-field" style="display:none;">
          <label class="eyebrow">Avatar (lien image, optionnel)</label>
          <input id="login-avatar" type="text" placeholder="https://..." autocomplete="off">
        </div>
        <div id="login-error" class="error-text"></div>
        <button type="submit" class="btn-primary" id="login-submit" style="margin-top:6px;">Se connecter</button>
      </form>
      <div id="login-footer">
        Le code protège ton compte des curieux, entre joueurs de confiance. Ce n'est pas un système sécurisé, ne réutilise pas un mot de passe important.
      </div>
    </div>

    <div id="screen-hub" class="screen">
      <div id="hub-top">
        <div class="who">
          <div class="avatar" id="hub-avatar"></div>
          <span class="username" id="hub-username"></span>
          <button id="edit-avatar-btn" type="button" class="icon-edit" aria-label="Modifier l'avatar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          </button>
        </div>
        <button id="logout-btn" type="button">Déconnexion</button>
      </div>
      <div id="new-conv-zone">
        <button class="btn-primary" id="show-new-conv" type="button">+ Nouvelle conversation</button>
        <form id="new-conv-form">
          <input id="new-conv-username" type="text" placeholder="Pseudo du destinataire" autocomplete="off">
          <div id="new-conv-error" class="error-text"></div>
          <div class="row">
            <button type="submit" class="btn-primary">Démarrer</button>
            <button type="button" class="btn-ghost" id="cancel-new-conv">Annuler</button>
          </div>
        </form>
      </div>
      <div id="conv-list"></div>
    </div>

    <div id="screen-chat" class="screen">
      <div id="chat-top">
        <span id="chat-back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </span>
        <div style="position:relative;">
          <div class="avatar" id="chat-avatar"></div>
          <span class="presence-dot" id="chat-presence-dot" style="display:none;"></span>
        </div>
        <div>
          <div class="top-line">
            <span id="chat-username"></span>
            <button id="edit-nickname-btn" type="button" class="icon-edit" aria-label="Renommer ce contact">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="messages"></div>
      <div class="quote-bar" id="quote-bar">
        <div class="qb-text">Réponse à <b id="quote-bar-name"></b><br><span id="quote-bar-snippet"></span></div>
        <button type="button" class="qb-close" id="quote-bar-close" aria-label="Annuler la citation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="chat-form">
        <button type="button" id="send-image-btn" aria-label="Envoyer une image">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <input id="chat-input" type="text" placeholder="Message..." autocomplete="off">
        <button type="submit">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<script>

try {

    throw new Error("CONFIG_MISSING");
  }

  db = firebase.firestore();

  document.getElementById("boot-error").textContent =
    e.message === "CONFIG_MISSING"
      ? "Configuration Firebase manquante. Remplace les valeurs firebaseConfig en haut du fichier avec celles de ton projet Firebase."
      : "Erreur de connexion à Firebase. Vérifie ta configuration.";
}

const AVATAR_COLORS = [
  { bg: "#3C3489", text: "#CECBF6" },
  { bg: "#085041", text: "#5DCAA5" },
  { bg: "#712B13", text: "#F0997B" },
  { bg: "#72243E", text: "#ED93B1" },
  { bg: "#0C447C", text: "#85B7EB" },
  { bg: "#633806", text: "#EF9F27" },
];
function colorFor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function convId(a, b) { return [a.toLowerCase(), b.toLowerCase()].sort().join("__"); }
function applyAvatar(el, name, avatarUrl) {
  if (avatarUrl) {
    el.style.background = "";
    el.style.backgroundImage = `url('${avatarUrl}')`;
    el.style.backgroundSize = "cover";
    el.style.backgroundPosition = "center";
    el.textContent = "";
  } else {
    const c = colorFor(name);
    el.style.backgroundImage = "none";
    el.style.background = c.bg;
    el.style.color = c.text;
    el.textContent = name[0].toUpperCase();
  }
}
function avatarInlineStyle(name, avatarUrl) {
  if (avatarUrl) return `background-image:url('${avatarUrl.replace(/'/g, "%27")}');background-size:cover;background-position:center;`;
  const c = colorFor(name);
  return `background:${c.bg};color:${c.text};`;
}
function avatarInlineLetter(name, avatarUrl) {
  return avatarUrl ? "" : name[0].toUpperCase();
}
function formatTime(ts) {
  const d = ts && ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}
function toDateObj(ts) { return ts && ts.toDate ? ts.toDate() : new Date(ts); }
function dayKey(ts) {
  const d = toDateObj(ts);
  return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
}
function dateLabel(ts) {
  const d = toDateObj(ts);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  const dOnly = new Date(d); dOnly.setHours(0, 0, 0, 0);
  if (dOnly.getTime() === today.getTime()) return "Aujourd'hui";
  if (dOnly.getTime() === yesterday.getTime()) return "Hier";
  const opts = { day: "numeric", month: "long" };
  if (dOnly.getFullYear() !== today.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString("fr-FR", opts);
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

let session = null;
let currentConv = null;
let unsubConvs = null;
let unsubMessages = null;
let replyingTo = null;
let lastConvList = [];
let presenceData = {};
let presenceUnsubs = {};
let heartbeatInterval = null;
let presenceRefreshInterval = null;

const ONLINE_THRESHOLD_MS = 60000;
function isOnline(lastSeen) {
  return !!lastSeen && (Date.now() - lastSeen) < ONLINE_THRESHOLD_MS;
}

function startHeartbeat() {
  const myKey = session.username.toLowerCase();
  const beat = () => db.collection("dm_users").doc(myKey).update({ lastSeen: Date.now() }).catch(() => {});
  beat();
  heartbeatInterval = setInterval(beat, 25000);
}
function stopHeartbeat() {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = null;
}

function ensurePresenceSub(otherKey) {
  if (presenceUnsubs[otherKey] || !otherKey) return;
  presenceUnsubs[otherKey] = db.collection("dm_users").doc(otherKey).onSnapshot((doc) => {
    presenceData[otherKey] = (doc.data() || {}).lastSeen || 0;
    refreshPresenceUI();
  }, () => {});
}
function stopAllPresence() {
  Object.values(presenceUnsubs).forEach(u => u());
  presenceUnsubs = {};
  presenceData = {};
}
function refreshPresenceUI() {
  if (document.getElementById("screen-hub").classList.contains("active")) {
    renderConvList(lastConvList);
  }
  if (currentConv && currentConv.otherKey) {
    const dot = document.getElementById("chat-presence-dot");
    dot.style.display = isOnline(presenceData[currentConv.otherKey]) ? "block" : "none";
  }
}

const chatInputEl = document.getElementById("chat-input");

function setReply(msg) {
  replyingTo = { id: msg.id, from: msg.from, snippet: msg.image ? "📷 Image" : (msg.text || "").slice(0, 70) };
  document.getElementById("quote-bar-name").textContent = msg.from;
  document.getElementById("quote-bar-snippet").textContent = replyingTo.snippet;
  document.getElementById("quote-bar").classList.add("open");
  chatInputEl.focus();
}
function clearReply() {
  replyingTo = null;
  document.getElementById("quote-bar").classList.remove("open");
}
document.getElementById("quote-bar-close").addEventListener("click", clearReply);

function saveSession(s) { localStorage.setItem("shinsei_dm_session", JSON.stringify(s)); }
function loadSession() {
  try {
    const raw = localStorage.getItem("shinsei_dm_session");
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearSession() { localStorage.removeItem("shinsei_dm_session"); }

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

let loginMode = "login";
document.getElementById("mode-login").onclick = () => setLoginMode("login");
document.getElementById("mode-create").onclick = () => setLoginMode("create");
function setLoginMode(mode) {
  loginMode = mode;
  document.getElementById("mode-login").classList.toggle("active", mode === "login");
  document.getElementById("mode-create").classList.toggle("active", mode === "create");
  document.getElementById("avatar-field").style.display = mode === "create" ? "block" : "none";
  document.getElementById("login-submit").textContent = mode === "login" ? "Se connecter" : "Créer mon compte";
  document.getElementById("login-error").textContent = "";
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  const uname = document.getElementById("login-username").value.trim();
  const pass = document.getElementById("login-code").value.trim();

  if (!uname || !pass) { errEl.textContent = "Remplis le pseudo et le code."; return; }
  if (!/^[a-zA-Z0-9_.]{2,20}$/.test(uname)) { errEl.textContent = "Pseudo invalide (lettres, chiffres, _ et . uniquement)."; return; }

  try {
    const ref = db.collection("dm_users").doc(uname.toLowerCase());
    const doc = await ref.get();

    if (loginMode === "create") {
      if (doc.exists) { errEl.textContent = "Ce pseudo existe déjà. Connecte-toi plutôt."; return; }
      const avatarUrl = document.getElementById("login-avatar").value.trim();
      await ref.set({ username: uname, code: pass, avatarUrl: avatarUrl || "", nicknames: {}, createdAt: Date.now() });
      session = { username: uname, avatarUrl: avatarUrl || "", nicknames: {} };
    } else {
      if (!doc.exists) { errEl.textContent = "Pseudo inconnu. Crée un compte d'abord."; return; }
      const data = doc.data();
      if (data.code !== pass) { errEl.textContent = "Code incorrect."; return; }
      session = { username: data.username, avatarUrl: data.avatarUrl || "", nicknames: data.nicknames || {} };
    }
    saveSession(session);
    enterHub();
  } catch (err) {
    errEl.textContent = "Erreur de connexion. Vérifie ta configuration Firebase.";
  }
});

document.getElementById("edit-avatar-btn").onclick = async () => {
  if (!session) return;
  const url = window.prompt("Nouveau lien d'avatar (laisse vide pour retirer) :", session.avatarUrl || "");
  if (url === null) return;
  const newUrl = url.trim();
  const myKey = session.username.toLowerCase();
  try {
    await db.collection("dm_users").doc(myKey).update({ avatarUrl: newUrl });
    session.avatarUrl = newUrl;
    saveSession(session);
    applyAvatar(document.getElementById("hub-avatar"), session.username, session.avatarUrl);

    const snap = await db.collection("dm_conversations").where("participants", "array-contains", myKey).get();
    const batch = db.batch();
    snap.forEach((d) => {
      batch.update(d.ref, { [`participantAvatars.${myKey}`]: newUrl });
    });
    await batch.commit();
  } catch (err) {}
};

document.getElementById("logout-btn").onclick = () => {
  clearSession();
  session = null;
  if (unsubConvs) unsubConvs();
  if (unsubMessages) unsubMessages();
  stopHeartbeat();
  stopAllPresence();
  if (presenceRefreshInterval) { clearInterval(presenceRefreshInterval); presenceRefreshInterval = null; }
  showScreen("screen-login");
};

document.getElementById("show-new-conv").onclick = () => {
  document.getElementById("new-conv-form").classList.add("active");
  document.getElementById("show-new-conv").style.display = "none";
};
document.getElementById("cancel-new-conv").onclick = () => {
  document.getElementById("new-conv-form").classList.remove("active");
  document.getElementById("show-new-conv").style.display = "block";
  document.getElementById("new-conv-error").textContent = "";
  document.getElementById("new-conv-username").value = "";
};

document.getElementById("new-conv-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("new-conv-error");
  errEl.textContent = "";
  const other = document.getElementById("new-conv-username").value.trim();
  if (!other) return;
  if (other.toLowerCase() === session.username.toLowerCase()) { errEl.textContent = "Tu ne peux pas discuter avec toi-même."; return; }

  try {
    const otherDoc = await db.collection("dm_users").doc(other.toLowerCase()).get();
    if (!otherDoc.exists) { errEl.textContent = "Ce joueur n'a pas encore de compte."; return; }
    const otherData = otherDoc.data();
    const cid = convId(session.username, other);

    const convRef = db.collection("dm_conversations").doc(cid);
    const convDoc = await convRef.get();
    if (!convDoc.exists) {
      await convRef.set({
        participants: [session.username.toLowerCase(), otherData.username.toLowerCase()],
        participantNames: { [session.username.toLowerCase()]: session.username, [otherData.username.toLowerCase()]: otherData.username },
        participantAvatars: { [session.username.toLowerCase()]: session.avatarUrl || "", [otherData.username.toLowerCase()]: otherData.avatarUrl || "" },
        lastMessage: "",
        lastMessageAt: Date.now(),
        lastMessageFrom: "",
        lastReadBy: { [session.username.toLowerCase()]: Date.now() },
        hiddenFor: [],
      });
    }
    document.getElementById("new-conv-form").classList.remove("active");
    document.getElementById("show-new-conv").style.display = "block";
    document.getElementById("new-conv-username").value = "";
    const okey = otherData.username.toLowerCase();
    const displayName = (session.nicknames && session.nicknames[okey]) || otherData.username;
    openConversation(cid, displayName, otherData.avatarUrl || "", okey, otherData.username);
  } catch (err) {
    errEl.textContent = "Erreur. Réessaie.";
  }
});

function enterHub() {
  const avatarEl = document.getElementById("hub-avatar");
  applyAvatar(avatarEl, session.username, session.avatarUrl);
  document.getElementById("hub-username").textContent = session.username;
  showScreen("screen-hub");
  listenConversations();
  startHeartbeat();
  if (!presenceRefreshInterval) presenceRefreshInterval = setInterval(refreshPresenceUI, 20000);
}

function listenConversations() {
  if (unsubConvs) unsubConvs();
  const myKey = session.username.toLowerCase();
  unsubConvs = db.collection("dm_conversations")
    .where("participants", "array-contains", myKey)
    .onSnapshot((snap) => {
      const list = [];
      snap.forEach((doc) => {
        const data = { id: doc.id, ...doc.data() };
        if ((data.hiddenFor || []).includes(myKey)) return;
        list.push(data);
      });
      list.sort((a, b) => (b.lastMessageAt || 0) - (a.lastMessageAt || 0));
      list.forEach((conv) => {
        const otherKey = conv.participants.find(p => p !== myKey);
        ensurePresenceSub(otherKey);
      });
      lastConvList = list;
      renderConvList(list);
    }, () => {
      document.getElementById("conv-list").innerHTML = '<div class="empty-state">Impossible de charger les conversations.</div>';
    });
}

function renderConvList(list) {
  const el = document.getElementById("conv-list");
  if (list.length === 0) {
    el.innerHTML = '<div class="empty-state">Aucune conversation pour l\'instant.</div>';
    return;
  }
  el.innerHTML = "";
  const myKey = session.username.toLowerCase();
  list.forEach((conv) => {
    const otherKey = conv.participants.find(p => p !== myKey);
    const realName = conv.participantNames ? conv.participantNames[otherKey] : otherKey;
    const otherName = (session.nicknames && session.nicknames[otherKey]) || realName;
    const otherAvatar = conv.participantAvatars ? (conv.participantAvatars[otherKey] || "") : "";
    const lastRead = (conv.lastReadBy && conv.lastReadBy[myKey]) || 0;
    const isUnread = conv.lastMessageFrom && conv.lastMessageFrom !== myKey && (conv.lastMessageAt || 0) > lastRead;

    const item = document.createElement("div");
    item.className = "conv-item" + (isUnread ? " unread" : "");
    item.innerHTML = `
      <div class="avatar" style="width:44px;height:44px;font-size:16px;${avatarInlineStyle(otherName, otherAvatar)}">${avatarInlineLetter(otherName, otherAvatar)}${isOnline(presenceData[otherKey]) ? '<span class="presence-dot"></span>' : ''}</div>
      <div class="info">
        <div class="top-line">
          <span>${escapeHtml(otherName)}</span>
        </div>
        <div class="preview">${escapeHtml(conv.lastMessage || "Démarrer la conversation")}</div>
      </div>
      ${isUnread ? '<span class="unread-dot"></span>' : ''}
      <button class="conv-delete" type="button" aria-label="Supprimer la conversation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
      </button>
    `;
    item.addEventListener("click", () => openConversation(conv.id, otherName, otherAvatar, otherKey, realName));
    item.querySelector(".conv-delete").addEventListener("click", (e) => {
      e.stopPropagation();
      db.collection("dm_conversations").doc(conv.id).update({
        hiddenFor: firebase.firestore.FieldValue.arrayUnion(myKey)
      });
    });
    el.appendChild(item);
  });
}

document.getElementById("chat-back").onclick = () => {
  if (unsubMessages) unsubMessages();
  showScreen("screen-hub");
};

function openConversation(cid, displayName, otherAvatar, otherKey, realName) {
  currentConv = { id: cid, otherUser: displayName, otherKey: otherKey, realName: realName };
  const avatarEl = document.getElementById("chat-avatar");
  applyAvatar(avatarEl, displayName, otherAvatar);
  document.getElementById("chat-username").textContent = displayName;
  showScreen("screen-chat");
  listenMessages();
  ensurePresenceSub(otherKey);
  document.getElementById("chat-presence-dot").style.display = isOnline(presenceData[otherKey]) ? "block" : "none";
  const myKey = session.username.toLowerCase();
  db.collection("dm_conversations").doc(cid).update({
    [`lastReadBy.${myKey}`]: Date.now()
  }).catch(() => {});
}

document.getElementById("edit-nickname-btn").onclick = async () => {
  if (!currentConv) return;
  const current = session.nicknames && session.nicknames[currentConv.otherKey];
  const value = window.prompt("Surnom pour " + currentConv.realName + " (visible seulement par toi, laisse vide pour retirer) :", current || "");
  if (value === null) return;
  const nickname = value.trim();
  const myKey = session.username.toLowerCase();
  try {
    if (nickname) {
      await db.collection("dm_users").doc(myKey).update({ [`nicknames.${currentConv.otherKey}`]: nickname });
      session.nicknames = session.nicknames || {};
      session.nicknames[currentConv.otherKey] = nickname;
    } else {
      await db.collection("dm_users").doc(myKey).update({ [`nicknames.${currentConv.otherKey}`]: firebase.firestore.FieldValue.delete() });
      if (session.nicknames) delete session.nicknames[currentConv.otherKey];
    }
    saveSession(session);
    const displayName = nickname || currentConv.realName;
    currentConv.otherUser = displayName;
    document.getElementById("chat-username").textContent = displayName;
  } catch (err) {}
};

function listenMessages() {
  if (unsubMessages) unsubMessages();
  const el = document.getElementById("messages");
  el.innerHTML = "";
  unsubMessages = db.collection("dm_conversations").doc(currentConv.id)
    .collection("dm_messages").orderBy("ts", "asc")
    .onSnapshot((snap) => {
      const msgs = [];
      snap.forEach((doc) => msgs.push({ id: doc.id, ...doc.data() }));
      renderMessages(msgs);
    });
}

const REACTION_EMOJIS = ["❤️", "👍", "😂", "😮", "😢"];

function toggleReaction(messageId, emoji) {
  const myKey = session.username.toLowerCase();
  const ref = db.collection("dm_conversations").doc(currentConv.id).collection("dm_messages").doc(messageId);
  ref.get().then((doc) => {
    const data = doc.data() || {};
    const reactions = data.reactions || {};
    if (reactions[myKey] === emoji) {
      delete reactions[myKey];
    } else {
      reactions[myKey] = emoji;
    }
    ref.update({ reactions });
  }).catch(() => {});
}

function deleteMessage(messageId, ts) {
  const convRef = db.collection("dm_conversations").doc(currentConv.id);
  convRef.collection("dm_messages").doc(messageId).update({
    deleted: true,
    text: "",
    image: firebase.firestore.FieldValue.delete(),
    reactions: {},
  }).then(() => {
    convRef.get().then((doc) => {
      const data = doc.data() || {};
      if (data.lastMessageAt === ts) {
        convRef.update({ lastMessage: "Message supprimé" });
      }
    });
  }).catch(() => {});
}

function renderMessages(msgs) {
  const el = document.getElementById("messages");
  if (msgs.length === 0) {
    el.innerHTML = '<div class="empty-state" style="margin-top:20px;">Aucun message. Lance la conversation.</div>';
    return;
  }
  el.innerHTML = "";
  const myKey = session.username.toLowerCase();
  const byId = {};
  msgs.forEach(m => byId[m.id] = m);
  let lastDay = null;

  msgs.forEach((m) => {
    const key = dayKey(m.ts);
    if (key !== lastDay) {
      lastDay = key;
      const sep = document.createElement("div");
      sep.className = "date-sep";
      sep.innerHTML = `<span>${dateLabel(m.ts)}</span>`;
      el.appendChild(sep);
    }

    const mine = m.from.toLowerCase() === myKey;
    const row = document.createElement("div");
    row.className = "msg-row " + (mine ? "mine" : "theirs");

    if (m.deleted) {
      row.innerHTML = `
        <div class="msg-wrap">
          <div class="bubble deleted">Message supprimé</div>
        </div>
        <span class="msg-time">${formatTime(m.ts)}</span>
      `;
      el.appendChild(row);
      return;
    }

    let quoteHtml = "";
    if (m.replyTo) {
      const orig = byId[m.replyTo.id];
      const snippet = orig ? (orig.deleted ? "Message supprimé" : (orig.image ? "📷 Image" : (orig.text || "").slice(0, 70))) : m.replyTo.snippet;
      quoteHtml = `<div class="quoted-block"><b>${escapeHtml(m.replyTo.from)}</b><br>${escapeHtml(snippet)}</div>`;
    }

    const innerContent = m.image
      ? `<img src="${escapeHtml(m.image)}" alt="" style="display:block;max-width:220px;width:100%;" onerror="this.style.display='none'">`
      : escapeHtml(m.text);

    const bubbleHtml = m.image
      ? `<div class="bubble bubble-image">${quoteHtml ? `<div style="padding:9px 13px 0;">${quoteHtml}</div>` : ""}${innerContent}</div>`
      : `<div class="bubble">${quoteHtml}${innerContent}</div>`;

    const pickerHtml = REACTION_EMOJIS.map(em => `<button type="button" data-emoji="${em}">${em}</button>`).join("");

    const deleteBtnHtml = mine ? `
        <button class="react-trigger" type="button" aria-label="Supprimer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
        </button>` : "";

    row.innerHTML = `
      <div class="msg-wrap">
        ${bubbleHtml}
        <button class="react-trigger" type="button" aria-label="Réagir">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
        </button>
        <button class="react-trigger" type="button" aria-label="Répondre">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17l-5-5 5-5M4 12h11a4 4 0 010 8h-1"/></svg>
        </button>${deleteBtnHtml}
        <div class="react-picker">${pickerHtml}</div>
      </div>
      <span class="msg-time">${formatTime(m.ts)}</span>
    `;

    const triggers = row.querySelectorAll(".react-trigger");
    const reactBtn = triggers[0];
    const replyBtn = triggers[1];
    const deleteBtn = mine ? triggers[2] : null;
    const picker = row.querySelector(".react-picker");
    reactBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".react-picker.open").forEach(p => { if (p !== picker) p.classList.remove("open"); });
      picker.classList.toggle("open");
    });
    replyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      setReply(m);
    });
    if (deleteBtn) {
      deleteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (window.confirm("Supprimer ce message ?")) deleteMessage(m.id, m.ts);
      });
    }
    picker.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleReaction(m.id, btn.dataset.emoji);
        picker.classList.remove("open");
      });
    });

    if (m.reactions && Object.keys(m.reactions).length > 0) {
      const counts = {};
      Object.entries(m.reactions).forEach(([user, emoji]) => {
        counts[emoji] = counts[emoji] || { count: 0, mine: false };
        counts[emoji].count++;
        if (user === myKey) counts[emoji].mine = true;
      });
      const reactionsEl = document.createElement("div");
      reactionsEl.className = "reactions";
      Object.entries(counts).forEach(([emoji, info]) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "reaction-chip" + (info.mine ? " mine-reaction" : "");
        chip.textContent = `${emoji} ${info.count}`;
        chip.addEventListener("click", () => toggleReaction(m.id, emoji));
        reactionsEl.appendChild(chip);
      });
      row.appendChild(reactionsEl);
    }

    el.appendChild(row);
  });
  el.scrollTop = el.scrollHeight;
}

document.addEventListener("click", () => {
  document.querySelectorAll(".react-picker.open").forEach(p => p.classList.remove("open"));
});

document.getElementById("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text || !currentConv) return;
  const replySnapshot = replyingTo;
  input.value = "";
  clearReply();
  try {
    const ts = Date.now();
    const msgData = { from: session.username, text, ts };
    if (replySnapshot) msgData.replyTo = replySnapshot;
    await db.collection("dm_conversations").doc(currentConv.id)
      .collection("dm_messages").add(msgData);
    await db.collection("dm_conversations").doc(currentConv.id).update({
      lastMessage: text,
      lastMessageAt: ts,
      lastMessageFrom: session.username.toLowerCase(),
      [`lastReadBy.${session.username.toLowerCase()}`]: ts,
      hiddenFor: [],
    });
  } catch (err) {
    input.value = text;
    if (replySnapshot) setReply({ id: replySnapshot.id, from: replySnapshot.from, text: replySnapshot.snippet });
  }
});

document.getElementById("send-image-btn").addEventListener("click", async () => {
  if (!currentConv) return;
  const url = window.prompt("Colle le lien de l'image (URL) :");
  if (!url || !url.trim()) return;
  const imageUrl = url.trim();
  const replySnapshot = replyingTo;
  clearReply();
  try {
    const ts = Date.now();
    const msgData = { from: session.username, image: imageUrl, ts };
    if (replySnapshot) msgData.replyTo = replySnapshot;
    await db.collection("dm_conversations").doc(currentConv.id)
      .collection("dm_messages").add(msgData);
    await db.collection("dm_conversations").doc(currentConv.id).update({
      lastMessage: "📷 Image",
      lastMessageAt: ts,
      lastMessageFrom: session.username.toLowerCase(),
      [`lastReadBy.${session.username.toLowerCase()}`]: ts,
      hiddenFor: [],
    });
  } catch (err) {}
});

(function boot() {
  if (!db) return;
  const saved = loadSession();
  if (saved) {
    session = saved;
    enterHub();
  }
})();
</script>
